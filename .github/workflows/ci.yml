name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and test desktop utility
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Package both editions
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cliptype-downloads
          path: |
            dist/ClipType-Windows.zip
            dist/ClipType-Extension.zip
            dist/SHA256SUMS.txt
