name: Checks
on:
  push:
    branches: [main, vnext]
  pull_request:
permissions:
  contents: read
env:
  NO_UPDATE_NOTIFIER: '1'
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/build_extensions.py
      - run: npm run lint:firefox
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm run test:firefox
      - run: npm run test:firefox:install
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s linux/tests -v
      - run: python scripts/package_linux.py
      - run: python dist/cliptype.pyz --help
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and test desktop utility
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Package all local development artifacts
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - name: Verify development artifacts
        run: python scripts/verify_artifacts.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cliptype-downloads
          path: |
            dist/ClipType-Windows.zip
            dist/ClipType-Chromium.zip
            dist/ClipType-Firefox.zip
            dist/ClipType-Linux.tar.gz
            dist/cliptype.pyz
            dist/SHA256SUMS.txt
